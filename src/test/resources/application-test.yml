
server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/galpi-test
    username: galpi
    password: galpi
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 100
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      timeout: 3s

galpi:
  crypto:
    token:
      current-version: 1
      keys:
        1: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
        2: ""
        3: ""

  cors:
    allowed-origins:
      - http://localhost:5173

  jwt:
    secret: galpi-test-secret-key-must-be-at-least-32-bytes
    issuer: galpi
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    session-absolute-ttl: 90d
    login-code-ttl: 60s
    cookie:
      name: galpi_refresh
      path: /auth
      secure: false
      same-site: Lax
      domain: ""

  github:
    app-id: "12345"
    app-slug: galpi-test-app
    client-id: Iv1.test-client-id
    client-secret: test-client-secret
    base-url: http://localhost:8080
    api-version: 2022-11-28
    api-base-url: https://api.github.com
    oauth-base-url: https://github.com
    user-agent: Galpi
    allowed-redirect-origins:
      - http://localhost:5173
    default-redirect-uri: http://localhost:5173/auth/callback
    connect-timeout: 5s
    read-timeout: 15s
    max-retries: 2
    max-pages: 10
    operation:
      max-requests: 50
      timeout: 30s
      max-concurrent-per-user: 1
      acquire-timeout: 3s

  collection:
    max-download-size: 200MB
    max-extracted-size: 1GB
    max-entry-count: 20000
    max-file-size: 1MB
    max-total-content-size: 20MB
    max-redirects: 3
    download-timeout: 120s
    max-pull-request-file-pages: 30
    max-pull-request-commit-pages: 30
    max-pull-request-list-pages: 30

  analysis:
    worker:
      # 스케줄러 자체는 SchedulingConfig가 test 프로파일에서 꺼 둔다. 테스트는 워커를
      # 직접 호출한다.
      enabled: true
      poll-interval: 5s
      lease: 30m
      max-attempts: 3

logging:
  level:
    org.hibernate.SQL: warn

swagger:
  servers:
    - http://localhost:8080

APP_SERVER_URL: http://localhost:8080
