
server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/galpi-test
    username: galpi
    password: galpi
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 5000 # Hikari는 밀리초 정수만 받는다

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

galpi:
  crypto:
    token:
      current-version: 1
      keys:
        1: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=

  cors:
    allowed-origins:
      - http://localhost:3000

  jwt:
    secret: galpi-test-secret-key-must-be-at-least-32-bytes

  github:
    app-id: "12345"
    client-id: Iv1.test-client-id
    client-secret: test-client-secret
    base-url: http://localhost:8080
    allowed-redirect-origins:
      - http://localhost:3000
    default-redirect-uri: http://localhost:3000/auth/callback

logging:
  level:
    org.hibernate.SQL: warn

swagger:
  servers:
    - http://localhost:8080

APP_SERVER_URL: http://localhost:8080
