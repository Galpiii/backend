server:
  port: ${SERVER_PORT}

spring:
  task:
    execution:
      mode: force
    # 분석 워커의 poll()이 수집 전체를 동기로 실행해 스레드를 수십 분씩 잡는다. 기본값 1이면
    # 그동안 토큰 폐기 배치가 한 번도 돌지 못한다. @Scheduled를 더 붙이면 이 값도 함께 올린다.
    #
    # PR 요약 워커가 세 번째다. 이쪽도 배치 하나가 끝날 때까지 폴링 스레드를 붙잡는다 --
    # 그래야 배치가 도는 동안 lease 연장이 계속된다.
    scheduling:
      pool:
        size: ${TASK_SCHEDULING_POOL_SIZE:3}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE}
      minimum-idle: ${DB_POOL_MIN_IDLE}
      connection-timeout: ${DB_CONNECTION_TIMEOUT}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: ${JPA_BATCH_FETCH_SIZE}
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED}
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT}

galpi:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}

  openai:
    api-key: ${OPENAI_API_KEY}
    model: ${OPENAI_MODEL}
    max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS}
    timeout: ${OPENAI_TIMEOUT}
    max-attempts: ${OPENAI_MAX_ATTEMPTS}
    analysis-budget: ${OPENAI_ANALYSIS_BUDGET}
    # PR 요약은 모델과 상한을 따로 둔다. 명세서 추출은 문서 한 건에 한 번이지만 요약은
    # 저장소 하나에 수백 건이라, 같은 값을 쓰면 비용이 그대로 곱해진다.
    summary-model: ${OPENAI_SUMMARY_MODEL:gpt-5-mini}
    summary-max-output-tokens: ${OPENAI_SUMMARY_MAX_OUTPUT_TOKENS:2000}
    summary-budget: ${OPENAI_SUMMARY_BUDGET:3m}

  feature-extraction:
    core-pool-size: ${FEATURE_EXTRACTION_CORE_POOL_SIZE}
    max-pool-size: ${FEATURE_EXTRACTION_MAX_POOL_SIZE}
    queue-capacity: ${FEATURE_EXTRACTION_QUEUE_CAPACITY}
    await-termination: ${FEATURE_EXTRACTION_AWAIT_TERMINATION}

  crypto:
    token:
      current-version: ${TOKEN_ENCRYPTION_CURRENT_VERSION:1}
      keys:
        1: ${TOKEN_ENCRYPTION_KEY_V1}
        2: ${TOKEN_ENCRYPTION_KEY_V2:}
        3: ${TOKEN_ENCRYPTION_KEY_V3:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  # 동의 정책 버전(galpi.consent.ai-data-version)은 여기에 두지 않는다. 문구와 버전은
  # AiDataNotice가 한 몸으로 들고 있고, 그 값이 기본값이다 — 여기에 날짜를 적어 두면 코드에서
  # 버전을 올려도 이 값이 덮어써서 재동의가 걸리지 않는다. 운영에서 굳이 되돌려야 할 때만
  # GALPI_CONSENT_AIDATAVERSION 환경변수로 덮는다(문구가 등록된 버전만 허용).

  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    access-token-ttl: ${JWT_ACCESS_TTL}
    refresh-token-ttl: ${JWT_REFRESH_TTL}
    session-absolute-ttl: ${JWT_SESSION_ABSOLUTE_TTL}
    login-code-ttl: ${JWT_LOGIN_CODE_TTL}
    cookie:
      name: ${JWT_COOKIE_NAME}
      path: ${JWT_COOKIE_PATH}
      secure: ${JWT_COOKIE_SECURE}
      same-site: ${JWT_COOKIE_SAME_SITE}
      domain: ${JWT_COOKIE_DOMAIN:}

  github:
    app-id: ${GITHUB_APP_ID}
    app-slug: ${GITHUB_APP_SLUG}
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
    private-key: ${GITHUB_PRIVATE_KEY}
    base-url: ${GITHUB_APP_BASE_URL}
    api-version: ${GITHUB_API_VERSION}
    api-base-url: ${GITHUB_API_BASE_URL}
    oauth-base-url: ${GITHUB_OAUTH_BASE_URL}
    user-agent: ${GITHUB_USER_AGENT}
    allowed-redirect-origins: ${GITHUB_ALLOWED_REDIRECT_ORIGINS}
    default-redirect-uri: ${GITHUB_DEFAULT_REDIRECT_URI}
    connect-timeout: ${GITHUB_CONNECT_TIMEOUT}
    read-timeout: ${GITHUB_READ_TIMEOUT}
    max-retries: ${GITHUB_MAX_RETRIES}
    max-pages: ${GITHUB_MAX_PAGES}
    operation:
      max-requests: ${GITHUB_OPERATION_MAX_REQUESTS:50}
      timeout: ${GITHUB_OPERATION_TIMEOUT:30s}
      max-concurrent-per-user: ${GITHUB_OPERATION_MAX_CONCURRENT_PER_USER:1}
      acquire-timeout: ${GITHUB_OPERATION_ACQUIRE_TIMEOUT:3s}

  # 저장소 하나를 수집할 때의 상한. 낮추는 것은 안전하고, 올리면 워커의 디스크와 시간을
  # 그만큼 더 쓴다.
  collection:
    max-download-size: ${COLLECTION_MAX_DOWNLOAD_SIZE:200MB}
    max-extracted-size: ${COLLECTION_MAX_EXTRACTED_SIZE:1GB}
    max-entry-count: ${COLLECTION_MAX_ENTRY_COUNT:20000}
    max-file-size: ${COLLECTION_MAX_FILE_SIZE:1MB}
    max-total-content-size: ${COLLECTION_MAX_TOTAL_CONTENT_SIZE:20MB}
    max-pull-request-content-size: ${COLLECTION_MAX_PR_CONTENT_SIZE:20MB}
    max-redirects: ${COLLECTION_MAX_REDIRECTS:3}
    download-timeout: ${COLLECTION_DOWNLOAD_TIMEOUT:120s}
    max-pull-request-file-pages: ${COLLECTION_MAX_PR_FILE_PAGES:30}
    max-pull-request-commit-pages: ${COLLECTION_MAX_PR_COMMIT_PAGES:30}
    max-pull-request-list-pages: ${COLLECTION_MAX_PR_LIST_PAGES:30}
    max-pull-request-api-requests: ${COLLECTION_MAX_PR_API_REQUESTS:930}

  project:
    # 남용 방지용 상한이다. 기능 제한이 아니라 한 계정이 프로젝트를 무한정 만들어 두는 것을
    # 막는 선이라 넉넉하게 잡는다. 삭제한 프로젝트는 세지 않는다.
    max-per-user: ${PROJECT_MAX_PER_USER:50}
    default-page-size: ${PROJECT_DEFAULT_PAGE_SIZE:20}
    max-page-size: ${PROJECT_MAX_PAGE_SIZE:100}

  pull-request:
    default-page-size: ${PR_DEFAULT_PAGE_SIZE:20}
    max-page-size: ${PR_MAX_PAGE_SIZE:100}
    # 상세 응답에 실을 변경 파일·커밋 수. PR 하나의 파일은 GitHub 상한인 3,000개까지 갈 수 있어
    # 전부 내리면 응답이 수 MB가 된다. 자른 사실은 각각의 *Truncated로 알린다.
    max-detail-files: ${PR_MAX_DETAIL_FILES:200}
    max-detail-commits: ${PR_MAX_DETAIL_COMMITS:200}

  summary:
    worker:
      # 분석 워커와 같은 이유로 끌 수 있게 둔다. API만 서비스하는 인스턴스에서 false.
      enabled: ${PR_SUMMARY_WORKER_ENABLED:true}
      poll-interval: ${PR_SUMMARY_POLL_INTERVAL:5s}
      # 분석 작업(30분)보다 짧다. 요약 하나는 GitHub 호출 한 번과 LLM 호출 한 번이라
      # 10분을 넘길 이유가 없고, 길게 잡으면 죽은 워커가 물고 있던 PR이 그만큼 늦게 풀린다.
      lease: ${PR_SUMMARY_LEASE:10m}
      retry-backoff: ${PR_SUMMARY_RETRY_BACKOFF:5s}
      max-attempts: ${PR_SUMMARY_MAX_ATTEMPTS:3}
      # 한 번에 여럿을 집는다. 요약 하나가 몇 초라 하나씩 집으면 폴링 주기가 그대로
      # 처리량 상한이 된다 -- 5초 주기면 PR 300개에 25분이 걸린다.
      batch-size: ${PR_SUMMARY_BATCH_SIZE:10}
      max-concurrency: ${PR_SUMMARY_MAX_CONCURRENCY:4}
    # LLM 입력에 담을 diff 상한. 파일당 상한이 따로 있는 이유는 거대한 lock 파일 하나가
    # 예산을 다 먹고 구현 파일의 diff가 한 줄도 못 들어가는 것을 막기 위해서다.
    max-patch-chars: ${PR_SUMMARY_MAX_PATCH_CHARS:60000}
    max-patch-chars-per-file: ${PR_SUMMARY_MAX_PATCH_CHARS_PER_FILE:8000}
    # diff뿐 아니라 본문·커밋·파일 목록까지 포함한 최종 LLM 입력 상한.
    max-input-chars: ${PR_SUMMARY_MAX_INPUT_CHARS:90000}
    # 요약 입력을 만들 때 받아 올 변경 파일 페이지 수(페이지당 100개). 수집(30페이지)과 나눈다.
    # 뒤쪽 페이지는 입력 상한에서 어차피 잘려, 받아 봐야 GitHub 호출만 쓴다.
    max-file-pages: ${PR_SUMMARY_MAX_FILE_PAGES:2}

  analysis:
    worker:
      # 인스턴스를 여러 개 띄워도 SKIP LOCKED 선점이 중복 실행을 막는다. 수집만 하는
      # 인스턴스를 따로 두고 싶으면 API 쪽에서 이 값을 false로 둔다.
      enabled: ${ANALYSIS_WORKER_ENABLED:true}
      poll-interval: ${ANALYSIS_WORKER_POLL_INTERVAL:5s}
      lease: ${ANALYSIS_WORKER_LEASE:30m}
      max-attempts: ${ANALYSIS_WORKER_MAX_ATTEMPTS:3}
      rate-limit-threshold: ${ANALYSIS_WORKER_RATE_LIMIT_THRESHOLD:1000}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

logging:
  level:
    org.hibernate.SQL: ${LOG_LEVEL_SQL}

swagger:
  servers:
    - ${APP_SERVER_URL}
