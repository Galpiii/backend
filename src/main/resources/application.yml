server:
  port: ${SERVER_PORT}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE}
      minimum-idle: ${DB_POOL_MIN_IDLE}
      connection-timeout: ${DB_CONNECTION_TIMEOUT}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: ${JPA_BATCH_FETCH_SIZE}
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED}
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      # 비어 있는 게 정상인 값은 기본값을 준다. 없으면 치환되지 않은 "${REDIS_PASSWORD}" 문자열이
      # 그대로 바인딩돼 기동은 성공하고 런타임에 터진다.
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT}

galpi:
  crypto:
    token:
      current-version: ${TOKEN_ENCRYPTION_CURRENT_VERSION:1}
      keys:
        1: ${TOKEN_ENCRYPTION_KEY_V1}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    access-token-ttl: ${JWT_ACCESS_TTL}
    refresh-token-ttl: ${JWT_REFRESH_TTL}
    login-code-ttl: ${JWT_LOGIN_CODE_TTL}
    cookie:
      name: ${JWT_COOKIE_NAME}
      path: ${JWT_COOKIE_PATH}
      secure: ${JWT_COOKIE_SECURE}
      same-site: ${JWT_COOKIE_SAME_SITE} # 프론트와 백엔드가 다른 사이트면 None(+secure=true), 같은 사이트면 Lax
      domain: ${JWT_COOKIE_DOMAIN:} # 비워두면 호스트 전용 쿠키. 위 REDIS_PASSWORD 주석 참고

  github:
    app-id: ${GITHUB_APP_ID}
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
    private-key: ${GITHUB_PRIVATE_KEY}
    base-url: ${GITHUB_APP_BASE_URL}
    api-version: ${GITHUB_API_VERSION}
    api-base-url: ${GITHUB_API_BASE_URL}
    oauth-base-url: ${GITHUB_OAUTH_BASE_URL}
    user-agent: ${GITHUB_USER_AGENT}
    allowed-redirect-origins: ${GITHUB_ALLOWED_REDIRECT_ORIGINS}
    default-redirect-uri: ${GITHUB_DEFAULT_REDIRECT_URI}
    connect-timeout: ${GITHUB_CONNECT_TIMEOUT}
    read-timeout: ${GITHUB_READ_TIMEOUT}
    max-retries: ${GITHUB_MAX_RETRIES}
    max-pages: ${GITHUB_MAX_PAGES}

logging:
  level:
    org.hibernate.SQL: ${LOG_LEVEL_SQL}

swagger:
  servers:
    - ${APP_SERVER_URL}
