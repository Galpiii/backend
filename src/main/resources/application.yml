server:
  port: ${SERVER_PORT}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE}
      minimum-idle: ${DB_POOL_MIN_IDLE}
      connection-timeout: ${DB_CONNECTION_TIMEOUT}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: ${JPA_BATCH_FETCH_SIZE}
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: ${LOG_LEVEL_SQL}

swagger:
  servers:
    - ${APP_SERVER_URL}
