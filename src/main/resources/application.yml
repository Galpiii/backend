server:
  port: ${SERVER_PORT}

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE}
      minimum-idle: ${DB_POOL_MIN_IDLE}
      connection-timeout: ${DB_CONNECTION_TIMEOUT}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: ${JPA_BATCH_FETCH_SIZE}
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED}
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT}

galpi:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}

  crypto:
    token:
      current-version: ${TOKEN_ENCRYPTION_CURRENT_VERSION:1}
      keys:
        1: ${TOKEN_ENCRYPTION_KEY_V1}
        2: ${TOKEN_ENCRYPTION_KEY_V2:}
        3: ${TOKEN_ENCRYPTION_KEY_V3:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    access-token-ttl: ${JWT_ACCESS_TTL}
    refresh-token-ttl: ${JWT_REFRESH_TTL}
    session-absolute-ttl: ${JWT_SESSION_ABSOLUTE_TTL}
    login-code-ttl: ${JWT_LOGIN_CODE_TTL}
    cookie:
      name: ${JWT_COOKIE_NAME}
      path: ${JWT_COOKIE_PATH}
      secure: ${JWT_COOKIE_SECURE}
      same-site: ${JWT_COOKIE_SAME_SITE}
      domain: ${JWT_COOKIE_DOMAIN:}

  github:
    app-id: ${GITHUB_APP_ID}
    app-slug: ${GITHUB_APP_SLUG}
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
    private-key: ${GITHUB_PRIVATE_KEY}
    base-url: ${GITHUB_APP_BASE_URL}
    api-version: ${GITHUB_API_VERSION}
    api-base-url: ${GITHUB_API_BASE_URL}
    oauth-base-url: ${GITHUB_OAUTH_BASE_URL}
    user-agent: ${GITHUB_USER_AGENT}
    allowed-redirect-origins: ${GITHUB_ALLOWED_REDIRECT_ORIGINS}
    default-redirect-uri: ${GITHUB_DEFAULT_REDIRECT_URI}
    connect-timeout: ${GITHUB_CONNECT_TIMEOUT}
    read-timeout: ${GITHUB_READ_TIMEOUT}
    max-retries: ${GITHUB_MAX_RETRIES}
    max-pages: ${GITHUB_MAX_PAGES}
    operation:
      max-requests: ${GITHUB_OPERATION_MAX_REQUESTS:50}
      timeout: ${GITHUB_OPERATION_TIMEOUT:30s}
      max-concurrent-per-user: ${GITHUB_OPERATION_MAX_CONCURRENT_PER_USER:1}
      acquire-timeout: ${GITHUB_OPERATION_ACQUIRE_TIMEOUT:3s}

  # 저장소 하나를 수집할 때의 상한. 낮추는 것은 안전하고, 올리면 워커의 디스크와 시간을
  # 그만큼 더 쓴다.
  collection:
    max-download-size: ${COLLECTION_MAX_DOWNLOAD_SIZE:200MB}
    max-extracted-size: ${COLLECTION_MAX_EXTRACTED_SIZE:1GB}
    max-entry-count: ${COLLECTION_MAX_ENTRY_COUNT:20000}
    max-file-size: ${COLLECTION_MAX_FILE_SIZE:1MB}
    max-total-content-size: ${COLLECTION_MAX_TOTAL_CONTENT_SIZE:20MB}
    max-redirects: ${COLLECTION_MAX_REDIRECTS:3}
    download-timeout: ${COLLECTION_DOWNLOAD_TIMEOUT:120s}
    max-pull-request-file-pages: ${COLLECTION_MAX_PR_FILE_PAGES:30}
    max-pull-request-commit-pages: ${COLLECTION_MAX_PR_COMMIT_PAGES:30}
    max-pull-request-list-pages: ${COLLECTION_MAX_PR_LIST_PAGES:30}

  analysis:
    worker:
      # 인스턴스를 여러 개 띄워도 SKIP LOCKED 선점이 중복 실행을 막는다. 수집만 하는
      # 인스턴스를 따로 두고 싶으면 API 쪽에서 이 값을 false로 둔다.
      enabled: ${ANALYSIS_WORKER_ENABLED:true}
      poll-interval: ${ANALYSIS_WORKER_POLL_INTERVAL:5s}
      lease: ${ANALYSIS_WORKER_LEASE:30m}
      max-attempts: ${ANALYSIS_WORKER_MAX_ATTEMPTS:3}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

logging:
  level:
    org.hibernate.SQL: ${LOG_LEVEL_SQL}

swagger:
  servers:
    - ${APP_SERVER_URL}
